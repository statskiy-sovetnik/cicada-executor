# Локальный запуск собранного образа.
#
#   docker compose build
#   docker compose up -d
#   docker compose logs -f
#
# Секреты берутся из .env (ALCHEMY_API_KEY, OPERATOR_PRIVATE_KEY): в образ они
# не попадают. Путь к базе и порт заданы здесь явно — значения из .env рассчитаны
# на запуск без контейнера, а `environment` перекрывает `env_file`.

services:
  executor:
    build: .
    image: cicada-executor
    env_file: .env
    environment:
      DB_PATH: /data/executor.sqlite
      PORT: 8787
      # Источник UI. На проде вместо * — адрес интерфейса (7.2).
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - '${EXECUTOR_PORT:-8787}:8787'
    volumes:
      - executor-db:/data
    init: true
    restart: unless-stopped

volumes:
  executor-db:
